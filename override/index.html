<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="${colorPrimary}" />
    <meta name="description" content="${description}" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.signau.css?v=12">
    <title>${title}</title>
    <style>
      .loader {
        position: fixed; inset: 0; margin: auto;
        width: 40px; aspect-ratio: 1; box-sizing: content-box; animation: ll 1s infinite linear;
        border-radius: 50%; border: 4px solid lightgray; border-right-color: black;
      }
      @keyframes ll {to{transform: rotate(1turn)}}
    </style>
    <script>
      (function () {
        function syncLoginBg() {
          var onLogin = location.pathname === '/login' || location.pathname.indexOf('/login/') === 0;
          document.documentElement.classList.toggle('signau-login', onLogin);
        }
        syncLoginBg();
        window.addEventListener('popstate', syncLoginBg);
        var push = history.pushState;
        history.pushState = function () {
          var r = push.apply(this, arguments);
          syncLoginBg();
          return r;
        };
        var replace = history.replaceState;
        history.replaceState = function () {
          var r = replace.apply(this, arguments);
          syncLoginBg();
          return r;
        };
      })();
    </script>
