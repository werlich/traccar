<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06263d"/>
      <stop offset="48%" stop-color="#0a3a58"/>
      <stop offset="100%" stop-color="#0e4f6d"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#c2a35b" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#0e6f8c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06263d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7eb8c9" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#c2a35b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e8d7a8" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- soft shoreline / map shapes -->
  <path d="M-40 620 C220 540 380 700 620 610 C860 520 980 680 1220 600 C1460 520 1580 640 1680 580 L1680 920 L-40 920 Z" fill="#021c30" fill-opacity="0.35"/>
  <path d="M-40 700 C180 640 360 760 640 690 C920 620 1100 760 1360 700 C1520 660 1620 720 1680 690 L1680 920 L-40 920 Z" fill="#053050" fill-opacity="0.28"/>

  <!-- GPS track -->
  <path d="M180 720 C320 560 420 500 560 470 C720 435 820 520 960 390 C1080 280 1180 250 1320 220 C1400 205 1480 190 1540 160" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M180 720 C320 560 420 500 560 470 C720 435 820 520 960 390 C1080 280 1180 250 1320 220 C1400 205 1480 190 1540 160" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10" stroke-linecap="round"/>

  <!-- waypoints -->
  <circle cx="560" cy="470" r="7" fill="#c2a35b"/>
  <circle cx="560" cy="470" r="16" fill="none" stroke="#c2a35b" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="960" cy="390" r="7" fill="#e8d7a8"/>
  <circle cx="960" cy="390" r="16" fill="none" stroke="#e8d7a8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- destination pin -->
  <g transform="translate(1540 160)">
    <circle r="28" fill="#c2a35b" fill-opacity="0.16"/>
    <path d="M0 -26 C-12 -26 -22 -16 -22 -4 C-22 12 0 30 0 30 C0 30 22 12 22 -4 C22 -16 12 -26 0 -26 Z" fill="#c2a35b"/>
    <circle cy="-8" r="7" fill="#06263d"/>
  </g>

  <!-- radar arcs -->
  <g transform="translate(280 220)" fill="none" stroke="#7eb8c9" stroke-opacity="0.18">
    <circle r="40" stroke-width="1.5"/>
    <circle r="70" stroke-width="1.2"/>
    <circle r="100" stroke-width="1"/>
    <path d="M0 0 L85 -35" stroke="#c2a35b" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
    <circle r="5" fill="#c2a35b" stroke="none"/>
  </g>
</svg>
